# 웹 앱을 GitHub Pages에 올립니다.
# 화면 틀은 main 브랜치의 site/, 매일 바뀌는 데이터(전체 site 결과물)는 site-data 브랜치에서 가져옵니다.
name: 웹 앱 배포

on:
  push:
    branches: [main, site-data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 최신 데이터(site-data) 합치기
        run: |
          if git fetch --depth 1 origin site-data 2>/dev/null; then
            mkdir -p /tmp/sd && git --work-tree=/tmp/sd checkout FETCH_HEAD -- . && git reset -q
            rm -rf /tmp/sd/.github site/hchunks && cp -r /tmp/sd/. site/
            echo "site-data 사용: $(ls site/hchunks | wc -l)개 일봉 묶음"
          else
            echo "site-data 브랜치 없음 → main의 site/ 그대로"
          fi
          mkdir -p site/vendor && cp tools/vendor/lightweight-charts.js site/vendor/lightweight-charts.js
          test -f site/data.json && test -f site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
