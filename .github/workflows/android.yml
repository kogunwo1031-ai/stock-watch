# 안드로이드 설치 파일(APK)을 만들어 Releases에 올립니다.
# 앱은 웹 앱 주소를 여는 방식이라, 매주 데이터가 바뀌어도 APK를 다시 설치할 필요가 없습니다.
name: 안드로이드 APK 빌드

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::저장소 Settings → Secrets and variables → Actions 에 KEYSTORE_PASS 를 추가해 주세요"; exit 1; fi
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; else cp android/release.jks "$RUNNER_TEMP/release.jks"; fi
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASS" > /dev/null || { echo "::error::KEYSTORE_PASS 가 서명 키와 맞지 않습니다"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: APK 빌드
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then export APP_URL="https://$OWNER.github.io/"; else export APP_URL="https://$OWNER.github.io/$REPO/"; fi
          echo "앱 주소: $APP_URL"
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk StockWatch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StockWatch-apk
          path: StockWatch.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 저평가 워치 안드로이드 앱 1.0.${{ github.run_number }}
          body: |
            폰에서 이 페이지를 열고 아래 StockWatch.apk를 눌러 설치하세요.
            처음 설치할 때 '출처를 알 수 없는 앱 설치'를 한 번 허용해야 합니다.
          files: StockWatch.apk
          make_latest: true
