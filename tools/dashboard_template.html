<title>저평가 워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 증권 앱형 레이아웃: 위 앱 바 → 탭별 화면(홈·종목·관심·내 투자·더보기) → 아래 탭 바(모바일) / 위 탭(PC).
   홈 = 지수 띠 + 시장 등락 + BEST 순위 + 섹터 등락 + 내 관심 미리보기. 종목을 누르면 상세(차트·거래량·지표·내 기록).
   등락 색은 국내식(상승 빨강·하락 파랑) 기본. 숫자는 같은 서체의 고정폭 숫자. */
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --surface-2: #F2F4F6; --surface-3: #E8EBEE; --fg: #191F28; --fg-2: #333D4B; --muted: #8B95A1; --line: #E5E8EB;
  --accent: #3182F6; --accent-bg: #E8F3FF; --ink: #3182F6;
  --good: #1B7A43; --good-bg: #E3F2E8; --warn-bg: #FFF2C7; --warn: #7A5A00; --alert-bg: #FDECEA; --alert: #B42318;
  --c-bg: #EEF0F3; --c-fg: #4E5968; --star: #FFB800;
  --up: #F04452; --down: #3182F6;
  --ma1: #F59E0B; --ma2: #8B5CF6; --ma3: #10B981; --vol: rgba(139, 149, 161, .45);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 20px; --r-sm: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
}
:root[data-updown="us"] { --up: #16A34A; --down: #F04452 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101013; --surface: #1B1B20; --surface-2: #232329; --surface-3: #2C2C35; --fg: #F2F4F6; --fg-2: #D1D6DB; --muted: #8B95A1; --line: #2C2C35;
  --accent: #4C9AFF; --accent-bg: #1B2B45; --ink: #4C9AFF;
  --good: #6FD39A; --good-bg: #173524; --warn-bg: #3A3013; --warn: #F1CE6B; --alert-bg: #3A1A18; --alert: #FFB4AB;
  --c-bg: #2C2C35; --c-fg: #B0B8C1; --star: #FFC933; --up: #FF5B67; --down: #4C9AFF; --vol: rgba(139, 149, 161, .35); color-scheme: dark }
  :root:not([data-theme="light"])[data-updown="us"] { --up: #4ADE80; --down: #FF5B67 } }
:root[data-theme="dark"] {
  --bg: #101013; --surface: #1B1B20; --surface-2: #232329; --surface-3: #2C2C35; --fg: #F2F4F6; --fg-2: #D1D6DB; --muted: #8B95A1; --line: #2C2C35;
  --accent: #4C9AFF; --accent-bg: #1B2B45; --ink: #4C9AFF;
  --good: #6FD39A; --good-bg: #173524; --warn-bg: #3A3013; --warn: #F1CE6B; --alert-bg: #3A1A18; --alert: #FFB4AB;
  --c-bg: #2C2C35; --c-fg: #B0B8C1; --star: #FFC933; --up: #FF5B67; --down: #4C9AFF; --vol: rgba(139, 149, 161, .35); color-scheme: dark }
:root[data-theme="dark"][data-updown="us"] { --up: #4ADE80; --down: #FF5B67 }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html { scroll-padding-top: 70px }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; padding-bottom: calc(66px + env(safe-area-inset-bottom)) }
a { color: inherit; text-decoration: none }
button, select, input, textarea { font: inherit; color: inherit; letter-spacing: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
.na { color: var(--muted); font-weight: 400 }
.pos { color: var(--up) } .neg { color: var(--down) }

/* 앱 바 */
header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; max-width: 1000px; margin: 0 auto }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em }
.brand span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wrap { max-width: 1000px; margin: 0 auto; padding: 4px 16px 32px; display: grid; gap: 12px }
.wrap > * { min-width: 0 }
.view { display: grid; gap: 12px; min-width: 0 }
.view[hidden] { display: none }

.box { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow) }
.box.tight { padding: 16px 0 8px }
.box.tight > .bh { padding: 0 20px }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.bh h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em }
.bh .sub { font-size: 12.5px; color: var(--muted) }
.more { border: 0; background: none; color: var(--muted); font-size: 13.5px; padding: 0; white-space: nowrap }
.more:hover { color: var(--fg) }

/* 지수 띠 */
.idx { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px }
.idx::-webkit-scrollbar { display: none }
.ic { scroll-snap-align: start; background: var(--surface); border: 0; border-radius: 16px; padding: 14px 14px 10px; text-align: left; display: grid; gap: 1px; min-width: 0; box-shadow: var(--shadow) }
.ic .n { font-size: 13px; color: var(--fg-2); font-weight: 500; display: flex; justify-content: space-between; gap: 6px }
.ic .n i { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400 }
.ic .v { font-size: 18px; font-weight: 700; letter-spacing: -0.02em }
.ic .c { font-size: 13px; font-weight: 500 }
.ic .spark { width: 100%; height: 30px; margin-top: 4px }

/* 시장 등락 막대 */
.breadth { display: grid; gap: 8px }
.bbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-3) }
.bbar i { display: block; height: 100% }
.blbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted) }
.blbl b { font-weight: 700 }

/* 칩 탭 */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px }
.box:not(.tight) .chips { margin: 0; padding: 0 }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 0; background: var(--surface-2); color: var(--fg-2); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--surface); font-weight: 700 }
.box.tight .chips { padding-bottom: 4px }

/* 종목 한 줄 */
.rows { display: grid }
.rw { display: grid; grid-template-columns: auto 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 20px; cursor: pointer; min-width: 0 }
.rw:hover, .rw:focus-visible { background: var(--surface-2) }
.rk { width: 18px; text-align: center; font-weight: 700; color: var(--accent); font-size: 15px }
.rw.norank { grid-template-columns: 40px minmax(0, 1fr) auto }
.rw.norank .rk { display: none }
.logo { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 11px; letter-spacing: -0.02em; overflow: hidden; position: relative }
.logo.sm { width: 34px; height: 34px; font-size: 10px }
.logo .st { position: absolute; right: -2px; bottom: -2px; color: var(--star); font-size: 13px; text-shadow: 0 0 2px var(--surface) }
.rw .nm { min-width: 0 }
.rw .n { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rw .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center }
.rp { text-align: right; display: grid; justify-items: end; gap: 0 }
.rp .p { font-weight: 700; font-size: 15.5px }
.rp .c { font-size: 13px; font-weight: 500 }
.grade { font-weight: 800; font-size: 11px; width: 18px; height: 18px; border-radius: 6px; display: inline-grid; place-items: center; flex: none }
.g-A { background: var(--good-bg); color: var(--good) } .g-B { background: var(--warn-bg); color: var(--warn) } .g-C { background: var(--c-bg); color: var(--c-fg) }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-weight: 500 }
.badge.warn { background: var(--warn-bg); color: var(--warn) }
.badge.alert { background: var(--alert-bg); color: var(--alert) }
.hit { color: var(--good); font-weight: 700 }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); font-size: 14px; display: grid; gap: 10px; justify-items: center }
.btn { border: 0; background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px }
.btn.prim { background: var(--accent); color: #fff }
.btn.on { background: var(--accent-bg); color: var(--accent) }

/* 섹터 등락 타일 */
.secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px }
.sec { border: 0; border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 2px; min-width: 0 }
.sec .n { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sec .c { font-size: 16px; font-weight: 800 }
.sec .s { font-size: 11.5px; color: var(--fg-2); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* 종목 탭 필터 */
.bar { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 10; background: var(--bg); display: grid; gap: 8px; padding: 4px 0 8px }
.srow { display: flex; gap: 8px }
.search { flex: 1 1 auto; min-width: 0; padding: 11px 14px; border: 0; border-radius: 12px; background: var(--surface); font-size: 15px }
.ctrls { display: grid; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
select { padding: 10px 12px; border: 0; border-radius: 12px; background: var(--surface); max-width: 100%; font-size: 14px }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 12px; padding: 3px; flex: none; gap: 2px }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13.5px; border-radius: 9px; color: var(--fg-2); white-space: nowrap; font-weight: 500 }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; background: var(--surface); border-radius: 16px; padding: 14px 16px }
.filters[hidden] { display: none }
.fl { display: grid; gap: 4px; font-size: 13px }
.fl .top { display: flex; justify-content: space-between; color: var(--muted) }
.fl .top b { color: var(--fg) }
.fl input[type=range] { width: 100%; accent-color: var(--accent) }
.count { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; padding: 0 4px }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 600 }
.shead, .sfoot, #obtn { display: none }
.scrim { display: none }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; cursor: pointer; box-shadow: var(--shadow) }
.chead { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center }
.chead .n { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.chead .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.px { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end }
.big { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15 }
.chg { font-size: 14px; font-weight: 600 }
.asof { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.spark { display: block }
.card .spark { width: 110px; height: 40px }
.rw .spark { width: 56px; height: 26px }
.desc { font-size: 13.5px; margin: 0; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.m { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; display: grid; gap: 1px; min-width: 0 }
.m .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.m .v { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mine { font-size: 13px; background: var(--accent-bg); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px }
.mine .memo { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 13.5px }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle }
th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap }
th[aria-sort] { color: var(--fg) }
td.r, th.r { text-align: right }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--surface-2) }

/* 내 투자 요약 */
.sum { display: grid; gap: 4px }
.sum .k { font-size: 14px; color: var(--fg-2); font-weight: 500 }
.sum .v { font-size: 30px; font-weight: 800; letter-spacing: -0.03em }
.sum .c { font-size: 15px; font-weight: 600 }
.kv2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px }
.kv2 div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px }
.kv2 .k { font-size: 12px; color: var(--muted) } .kv2 .v { font-weight: 700 }

/* 더보기 */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px }
.gc { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; font-size: 13.5px; min-width: 0 }
.gc .k { color: var(--muted) }
.gc .t { font-weight: 800; font-size: 15px; display: flex; gap: 8px; align-items: center }
.gc .t i { width: 10px; height: 10px; border-radius: 50%; display: inline-block }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14.5px }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin: 0 }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2) }
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.pill.ok .d { background: var(--good) }

/* 탭 바: 모바일은 아래, 넓은 화면은 앱 바 아래 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom) }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; font-size: 11px; color: var(--muted); font-weight: 500 }
.tabbar svg { width: 24px; height: 24px }
.tabbar button[aria-pressed="true"] { color: var(--fg); font-weight: 700 }
@media (min-width: 900px) {
  body { padding-bottom: 0 }
  .tabbar { position: sticky; top: calc(56px + env(safe-area-inset-top)); bottom: auto; max-width: 1000px; margin: 0 auto; border: 0; background: var(--bg);
    display: flex; gap: 4px; padding: 0 16px 8px; z-index: 19 }
  .tabbar button { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; padding: 8px 14px; border-radius: 12px }
  .tabbar svg { width: 18px; height: 18px }
  .tabbar button[aria-pressed="true"] { background: var(--surface) }
  .bar { top: calc(104px + env(safe-area-inset-top)) }
  html { scroll-padding-top: 120px }
  .view[data-view="home"] { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-areas: "idx idx" "best br" "best sec" "best star" "best ."; align-items: start }
  .view[data-view="home"] > .idx { grid-area: idx } .h-br { grid-area: br } .h-best { grid-area: best } .h-sec { grid-area: sec } .h-star { grid-area: star }
  .h-sec .secs { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .view[data-view="star"], .view[data-view="hold"] { max-width: 720px; width: 100%; margin: 0 auto }
}

/* 상세 화면 */
dialog#dlg { padding: 0; border: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; height: 100dvh; max-height: 100dvh; width: min(760px, 100vw); max-width: 100vw; background: var(--bg); color: var(--fg); box-shadow: -8px 0 30px rgba(0,0,0,.25) }
dialog#dlg::backdrop { background: rgba(0, 0, 0, .45) }
.dl { display: grid; gap: 12px; padding: 0 16px calc(32px + env(safe-area-inset-bottom)) }
.dhead { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 0 8px; display: flex; align-items: center; gap: 4px }
.dhead .sp { flex: 1 }
.icon { border: 0; background: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; padding: 0; color: var(--fg) }
.icon:hover { background: var(--surface-3) }
.icon:disabled { opacity: .3 }
.icon svg { width: 22px; height: 22px }
.star[aria-pressed="true"] { color: var(--star) }
.dtop { display: grid; gap: 4px; padding: 4px 4px 0 }
.dtop .who { display: flex; align-items: center; gap: 10px; min-width: 0 }
.dtop .who .n { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.dtop .who .t { font-size: 13px; color: var(--muted) }
.dtop .big { font-size: 32px }
.dtop .chg { font-size: 15px }
.links { display: flex; flex-wrap: wrap; gap: 6px }
.links a { font-size: 13px; border-radius: 999px; padding: 6px 12px; background: var(--surface-2); white-space: nowrap; font-weight: 500 }
.links a:hover { background: var(--surface-3) }
.links a.pri { background: var(--accent); color: #fff }
.ctop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center }
.legend { font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 12px; min-height: 19px; color: var(--fg-2) }
.legend .k { color: var(--muted) }
.malgd { display: flex; gap: 12px; font-size: 12.5px; flex-wrap: wrap; color: var(--fg-2) }
.malgd label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.malgd i { width: 14px; height: 3px; border-radius: 2px; display: inline-block }
#chart { height: 320px; position: relative; min-width: 0; margin: 0 -8px }
.cnote { font-size: 12px; color: var(--muted) }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 20px }
.kv > div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; font-size: 14px }
.kv .k { color: var(--muted); white-space: nowrap } .kv .v { font-weight: 600; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.range { display: grid; gap: 6px }
.range .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }
.track { position: relative; height: 4px; border-radius: 2px; background: var(--surface-3) }
.pin { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--fg); border: 2px solid var(--surface) }
.txt { display: grid; gap: 10px; font-size: 14px; margin: 0 }
.txt dt { color: var(--muted); font-size: 12.5px; font-weight: 500 } .txt dd { margin: 0; color: var(--fg-2) }
.alertbox { background: var(--alert-bg); color: var(--alert); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; font-weight: 500 }
.form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0 }

<script>
const DATA = __DATA__;

const $ = s => document.querySelector(s);
const S = DATA.stocks, BY = Object.fromEntries(S.map(s => [s.t, s]));
const IX = DATA.indices || [], IBY = Object.fromEntries(IX.map(x => [x.sym, x]));
const COLORS = DATA.sector_colors, SECTORS = Object.keys(COLORS).filter(k => S.some(s => s.major === k));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const F0 = { up: -30, pe: 60, div: 0, off: 0 };
const state = { tab: LS.get("wl-tab", "home"), q: "", scen: "", sort: "grade", grades: new Set(["A","B","C"]), sectors: new Set(),
  view: LS.get("wl-view2", "rows"), f: { ...F0 }, list: [], cur: null, curKind: "stock", best: LS.get("wl-best", "up"),
  range: LS.get("wl-range", "all"), ma: LS.get("wl-ma", { 5: true, 20: true, 60: true }), ctype: LS.get("wl-ctype", "candle") };
document.documentElement.dataset.updown = LS.get("wl-updown", "kr");

/* ---------- 형식 ---------- */
const iso = n => { const s = String(n); return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; };
const md = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : "";
const days = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const fmtUsd = v => v == null ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNum = (v, d = 2) => v == null ? "—" : v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtKrw = v => v == null ? "—" : (v < 0 ? "-" : "") + Math.round(Math.abs(v)).toLocaleString("ko-KR") + "원";
const cls = v => v == null ? "" : v > 0.00005 ? "pos" : v < -0.00005 ? "neg" : "";
const fmtPct = (v, sign = true, d = 1) => v == null ? '<span class="na">—</span>' : `<span class="${cls(v)}">${sign && v > 0 ? "+" : ""}${(v * 100).toFixed(d)}%</span>`;
const fmtChg = v => v == null ? '<span class="na">—</span>' : `<span class="${cls(v)}">${v > 0 ? "+" : ""}${(v * 100).toFixed(2)}%</span>`;
const fmtX = v => v == null ? '<span class="na">—</span>' : v.toFixed(1) + "배";
const fmtDiv = v => v == null ? '<span class="na">무배당</span>' : (v * 100).toFixed(1) + "%";
const fmtCap = v => v == null ? "—" : v >= 1000 ? "$" + (v / 1000).toFixed(2) + "조" : "$" + v.toFixed(1) + "B";
const fmtBig = v => v == null ? "—" : v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(v);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2l2.6 5.5 6 .7-4.4 4.1 1.1 6-5.3-3-5.3 3 1.1-6-4.4-4.1 6-.7z"/></svg>';
const STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 3.2l2.6 5.5 6 .7-4.4 4.1 1.1 6-5.3-3-5.3 3 1.1-6-4.4-4.1 6-.7z"/></svg>';
const stale = s => days(DATA.quote_date, s.qdate) > 3;
const refLabel = s => !s.ref_date ? "" : days(s.qdate, s.ref_date) <= 4 ? "전일 대비" : `${md(s.ref_date)} 대비`;
const krw = () => (IBY["KRW=X"] || {}).price || null;
/* 종목별 파생 값: 거래량·거래대금·평소 대비 거래량 */
S.forEach(s => {
  const h = s.h || [], last = h[h.length - 1];
  s.vol = last && last.length > 5 && iso(last[0]) === s.qdate ? last[5] : null;
  s.tv = s.vol != null ? s.vol * s.price : null;
  const prev = h.slice(-21, -1).map(r => r[5]).filter(v => v > 0);
  s.vratio = s.vol != null && prev.length >= 10 ? s.vol / (prev.reduce((a, b) => a + b, 0) / prev.length) : null;
  s.pos52 = s.lo != null && s.hi != null && s.hi > s.lo ? (s.price - s.lo) / (s.hi - s.lo) : null;
});

/* ---------- 내 기록(관심·희망가·평단·수량·메모) ---------- */
const Store = { mode: "local", data: LS.get("wl-my", {}), col: null, timers: {}, chains: {}, pending: {}, err: "" };
const my = t => Store.data[t] || {};
const isEmpty = o => !o || (!o.star && o.buy == null && o.cost == null && o.qty == null && !String(o.memo || "").trim());
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setMy(t, patch) {
  Store.data[t] = { ...my(t), ...patch };
  if (isEmpty(Store.data[t])) delete Store.data[t];
  LS.set("wl-my", Store.data);
  queueWrite(t);
}
function queueWrite(t) {
  if (!Store.col) return;
  clearTimeout(Store.timers[t]);
  Store.timers[t] = setTimeout(() => {
    delete Store.timers[t];
    Store.chains[t] = (Store.chains[t] || Promise.resolve()).then(async () => {
      Store.pending[t] = true;
      const o = Store.data[t], ref = Store.col.doc(t);
      const body = o ? { star: !!o.star, buy: o.buy ?? null, cost: o.cost ?? null, qty: o.qty ?? null, memo: String(o.memo || "").slice(0, 4000), ts: Date.now() } : null;
      const run = () => body ? ref.set(body) : ref.delete();
      try { await run(); flash("저장됨"); }
      catch (e) {
        if (e && e.code === "unavailable") { await sleep(700 + Math.random() * 800); try { await run(); flash("저장됨"); return; } catch (e2) {} }
        Store.mode = "local"; Store.col = null; Store.err = "fail"; status();
      } finally { Store.pending[t] = false; }
    });
  }, 700);
}
function flash(msg) { const el = $("#savedmsg"); if (el) el.textContent = msg + " · " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }); }
function status() {
  const el = $("#store"); if (!el) return;
  el.className = "pill" + (Store.mode === "db" ? " ok" : "");
  el.innerHTML = `<span class="d"></span>${Store.mode === "db" ? "내 계정 (다른 기기에서도 보임)" : Store.err === "fail" ? "계정 저장 실패 · 이 기기에만 저장 중" : "이 기기에 저장"}`;
}
async function initDb() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const col = db.collection("data/users/" + uid);
    let first = true;
    col.onSnapshot(snap => {
      const remote = {};
      snap.docs.forEach(d => { if (d.exists) { const b = d.data() || {}; remote[d.id] = { star: !!b.star, buy: b.buy ?? null, cost: b.cost ?? null, qty: b.qty ?? null, memo: b.memo || "" }; } });
      if (first) {
        first = false; Store.col = col; Store.mode = "db"; Store.err = "";
        const localOnly = Object.keys(Store.data).filter(t => !remote[t] && !isEmpty(Store.data[t]) && BY[t]);
        Store.data = { ...Store.data, ...remote };
        localOnly.forEach(queueWrite);
      } else {
        for (const t in remote) if (!Store.timers[t] && !Store.pending[t]) Store.data[t] = remote[t];
        for (const t in Store.data) if (!remote[t] && !Store.timers[t] && !Store.pending[t]) delete Store.data[t];
      }
      LS.set("wl-my", Store.data);
      status(); renderAll(); syncDrawerStar();
    }, () => { Store.mode = "local"; Store.col = null; Store.err = "fail"; status(); });
  } catch (e) { /* 계정 저장을 쓸 수 없으면 기기 저장으로 계속 */ }
}

/* ---------- 공통 조각 ---------- */
function spark(h, cls2 = "spark", n = 60) {
  if (!h || h.length < 2) return "";
  const cs = h.slice(-n).map(r => r[4]), mn = Math.min(...cs), mx = Math.max(...cs), rg = mx - mn || 1, W = 100, H = 30;
  const pts = cs.map((c, i) => `${(i / (cs.length - 1) * W).toFixed(1)},${(H - 2 - (c - mn) / rg * (H - 4)).toFixed(1)}`).join(" ");
  const up = cs[cs.length - 1] >= cs[0];
  return `<svg class="${cls2}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${up ? "--up" : "--down"})" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function logo(s, sm) {
  const st = my(s.t).star ? '<span class="st">★</span>' : "";
  return `<span class="logo${sm ? " sm" : ""}" style="background:#${s.color}" aria-hidden="true">${esc(s.t.length > 4 ? s.t.slice(0, 4) : s.t)}${st}</span>`;
}
function periodRet(h) { if (!h || h.length < 2) return null; return h[h.length - 1][4] / h[0][4] - 1; }
function lateBadge(s) { return stale(s) ? `<span class="badge warn">${md(s.qdate)} 기준</span>` : ""; }
/* 종목 한 줄. right: 오른쪽 둘째 줄을 바꿀 때 사용 */
function rowItem(s, o = {}) {
  const m = my(s.t), hit = m.buy && s.price <= m.buy;
  const sub = o.sub ?? `<span class="grade g-${s.grade}">${s.grade}</span><span>${esc(s.major)}</span>${hit ? '<span class="hit">희망가 도달</span>' : ""}${s.note ? '<span class="badge alert">인수 진행</span>' : ""}${lateBadge(s)}`;
  return `<div class="rw${o.rank ? "" : " norank"}" data-open="${esc(s.t)}" role="button" tabindex="0" aria-label="${esc(s.name)} 상세">
    <span class="rk">${o.rank || ""}</span>${logo(s)}
    <div class="nm"><div class="n">${esc(s.name)}</div><div class="s">${sub}</div></div>

/* ---------- 차트 ---------- */
let chart = null, lwP = null, chartMain = null, chartBars = [];
function loadLW() {
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  const srcs = window.LW_SRCS || ["https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"];
  const one = src => new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = src;
    sc.onload = () => window.LightweightCharts ? res(window.LightweightCharts) : rej(new Error("no lib"));
    sc.onerror = () => { sc.remove(); rej(new Error("load failed")); };
    document.head.appendChild(sc); setTimeout(() => rej(new Error("timeout")), 9000);
  });
  if (!lwP) lwP = srcs.reduce((p, src) => p.catch(() => one(src)), Promise.reject(new Error("start")));
  return lwP;
}
function destroyChart() { if (chart) { try { chart.remove(); } catch (e) {} chart = null; chartMain = null; } }
function sma(bars, n) { const out = []; let sum = 0; bars.forEach((b, i) => { sum += b.close; if (i >= n) sum -= bars[i - n].close; if (i >= n - 1) out.push({ time: b.time, value: +(sum / n).toFixed(4) }); }); return out; }
const pfmt = p => state.curKind === "index" ? fmtNum(p, Math.abs(p) < 100 ? 3 : 2) : "$" + p.toFixed(2);

  el.innerHTML = `<span>${b.time}</span><span><span class="k">시</span> ${pfmt(b.open)}</span><span><span class="k">고</span> ${pfmt(b.high)}</span><span><span class="k">저</span> ${pfmt(b.low)}</span><span><span class="k">종</span> <b class="${b.close >= b.open ? "pos" : "neg"}">${pfmt(b.close)}</b></span>${c == null ? "" : `<span>${fmtChg(c)}</span>`}${b.vol ? `<span><span class="k">거래량</span> ${fmtBig(b.vol)}</span>` : ""}`;
}
function applyRange() {
  if (!chart || !chartBars.length) return;
  const n = chartBars.length, r = state.range;

function svgFallback(bars) {
  const W = 760, H = 300, P = 10, n = bars.length;
  const hi = Math.max(...bars.map(b => b.high)), lo = Math.min(...bars.map(b => b.low)), y = v => P + (hi - v) / ((hi - lo) || 1) * (H - 2 * P), bw = (W - 2 * P) / n;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">${bars.map((b, i) => {

    return `<line x1="${x}" x2="${x}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${c}" vector-effect="non-scaling-stroke"/><rect x="${x - bw * .35}" width="${bw * .7}" y="${y(Math.max(b.open, b.close))}" height="${Math.max(1, Math.abs(y(b.open) - y(b.close)))}" fill="${c}"/>`;
  }).join("")}</svg>`;
}
async function drawChart() {

  }
  if (kind === "stock") {
    const m = my(key), s = obj, dashed = L.LineStyle ? L.LineStyle.Dashed : 2;

function goSector(k) { state.sectors = new Set([k]); chips(); renderStocks(); setTab("stocks"); }
document.addEventListener("click", e => {
  const st = e.target.closest("[data-star]");
  if (st) { e.stopPropagation(); const t = st.dataset.star; setMy(t, { star: !my(t).star }); renderAll(); syncDrawerStar(); return; }
  if (e.target.closest("#dlg")) {
    if (e.target === dlg || e.target.closest("[data-close]")) { closeDetail(); return; }
    const nv = e.target.closest("[data-nav]"); if (nv) { nav(+nv.dataset.nav); return; }
    const rb = e.target.closest("#rng button"); if (rb) { state.range = rb.dataset.r; LS.set("wl-range", state.range); chartBtns(); applyRange(); return; }
    const cb = e.target.closest("#ctype button"); if (cb) { state.ctype = cb.dataset.c; LS.set("wl-ctype", state.ctype); chartBtns(); drawChart(); return; }
    return;
  }
  if (e.target.closest("a")) return;
  const tb = e.target.closest("#tabbar button"); if (tb) { setTab(tb.dataset.tab); return; }
  const go = e.target.closest("[data-go]"); if (go) { setTab(go.dataset.go); return; }
  const ic = e.target.closest("[data-idx]"); if (ic) { openIndex(ic.dataset.idx); return; }
  const bc = e.target.closest("[data-best]"); if (bc) { state.best = bc.dataset.best; LS.set("wl-best", state.best); renderHome(); return; }
  if (e.target.closest("#bestmore")) {
    const map = { up: "dchg", down: "dchg_lo", tv: "tv", vol: "dchg", upside: "upside", low: "off52", div: "div" };
    state.sort = map[state.best] || "grade"; state.sectors.clear(); chips(); renderStocks(); setTab("stocks"); return;
  }
  const sc = e.target.closest("[data-sec]"); if (sc) { goSector(sc.dataset.sec); return; }
  const u = e.target.closest("#updown button");
  if (u) { document.documentElement.dataset.updown = u.dataset.u; LS.set("wl-updown", u.dataset.u); renderAll(); return; }
  const chip = e.target.closest("[data-s]");
  if (chip) { const k = chip.dataset.s; if (!k) state.sectors.clear(); else state.sectors.has(k) ? state.sectors.delete(k) : state.sectors.add(k); chips(); renderStocks(); return; }
  const g = e.target.closest("#grades button");
  if (g) { const v = g.dataset.g; if (state.grades.has(v) && state.grades.size > 1) state.grades.delete(v); else state.grades.add(v);
    g.setAttribute("aria-pressed", state.grades.has(v)); renderStocks(); return; }
  const v = e.target.closest("#view button"); if (v) { state.view = v.dataset.v; LS.set("wl-view2", state.view); renderStocks(); return; }
  if (e.target.closest("#fbtn")) { const f = $("#filters"); f.hidden = !f.hidden; $("#fbtn").setAttribute("aria-expanded", !f.hidden); return; }
  if (e.target.closest("#obtn")) { sheet(true); return; }
  if (e.target.closest("#cclose, #capply, #scrim")) { sheet(false); return; }
  if (e.target.closest("#reset, #reset2")) {
    Object.assign(state, { q: "", scen: "", sort: "grade", f: { ...F0 } }); state.grades = new Set(["A","B","C"]); state.sectors.clear();
    $("#q").value = ""; $("#scen").value = ""; ["fu","fp","fd","fo"].forEach((id, i) => $("#" + id).value = [F0.up, F0.pe, F0.div, F0.off][i]);
    document.querySelectorAll("#grades button").forEach(b => b.setAttribute("aria-pressed", "true")); fLabels(); chips(); renderStocks(); return;
  }
  const th = e.target.closest("th[data-sort]"); if (th) { state.sort = th.dataset.sort; renderStocks(); return; }
  const op = e.target.closest("[data-open]"); if (op) openDetail(op.dataset.open);
});
function sheet(open) {
  $("#ctrls").classList.toggle("open", open); $("#scrim").hidden = !open; $("#obtn").setAttribute("aria-expanded", open);
  document.body.style.overflow = open ? "hidden" : ""; document.body.classList.toggle("sheet-open", open);
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#ctrls").classList.contains("open")) { sheet(false); return; }
  const rw = e.target.closest && e.target.closest(".rw");
  if (rw && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(rw.dataset.open); }
});
function nav(d) {
  const lst = state.curKind === "stock" ? navList() : IX.map(x => x.sym);
  const i = lst.indexOf(state.cur), j = i + d;
  if (i >= 0 && j >= 0 && j < lst.length) state.curKind === "stock" ? openDetail(lst[j]) : openIndex(lst[j]);
}
dlg.addEventListener("close", () => { destroyChart(); state.cur = null; });
dlg.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); nav(-1); } else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); nav(1); }
});
const numOf = v => { const x = parseFloat(String(v).replace(/[,$\s]/g, "")); return isFinite(x) && x > 0 ? x : null; };
let redrawT = null, renderT = null;
dlg.addEventListener("input", e => {
  const inp = e.target.closest("[data-f]"); if (!inp || !state.cur) return;
  const t = state.cur, f = inp.dataset.f;
  setMy(t, { [f]: f === "memo" ? inp.value : numOf(inp.value) });
  $("#savedmsg").textContent = "저장 중…"; if (Store.mode !== "db") setTimeout(() => flash("이 기기에 저장됨"), 400);
  calc(); clearTimeout(renderT); renderT = setTimeout(renderAll, 300);
  if (f === "buy" || f === "cost") { clearTimeout(redrawT); redrawT = setTimeout(() => state.cur === t && drawChart(), 700); }
});
dlg.addEventListener("change", e => {
  const cb = e.target.closest("[data-ma]"); if (!cb) return;
  state.ma = { ...state.ma, [cb.dataset.ma]: cb.checked }; LS.set("wl-ma", state.ma); drawChart();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderStocks(); });
$("#scen").addEventListener("change", e => { state.scen = e.target.value; renderStocks(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; renderStocks(); });
[["fu", "up"], ["fp", "pe"], ["fd", "div"], ["fo", "off"]].forEach(([id, k]) => $("#" + id).addEventListener("input", e => { state.f[k] = +e.target.value; fLabels(); renderStocks(); }));

chips(); fLabels(); renderAll(); setTab(state.tab, false); initDb();
</script>
