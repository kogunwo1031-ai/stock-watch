<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="저평가 워치">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<title>저평가 우량주 워치리스트</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 개인용 워치리스트: 요약 → 필터(고정) → 카드/표 → 섹터 가이드. 종목을 누르면 오른쪽 패널에 일봉 캔들 차트·지표·내 메모.
   숫자는 모노 서체. 등락 색은 국내식(상승 빨강·하락 파랑)이 기본이며 미국식으로 바꿀 수 있음. */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --surface-2: #EEF1F4; --fg: #15202B; --muted: #5A6875; --line: #D8DFE6;
  --ink: #1F3864; --good: #1B7A43; --good-bg: #E3F2E8; --warn-bg: #FFF2C7; --warn: #7A5A00; --alert-bg: #FDECEA; --alert: #9A1C14;
  --c-bg: #E9ECEF; --c-fg: #4D5761; --star: #E0A100;
  --up: #D62D2D; --down: #1F5FCC;
  --ma1: #E08A00; --ma2: #7A3FC2; --ma3: #0E8C7A;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
:root[data-updown="us"] { --up: #1B7A43; --down: #C62828 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151B; --surface: #172029; --surface-2: #1E2933; --fg: #E6ECF1; --muted: #93A2AF; --line: #2A3743;
  --ink: #9DB8E8; --good: #6FD39A; --good-bg: #173524; --warn-bg: #3A3013; --warn: #F1CE6B; --alert-bg: #3A1A18; --alert: #FFB4AB;
  --c-bg: #26313B; --c-fg: #B5C0CA; --star: #F5C542; --up: #FF6B6B; --down: #6FA8FF;
  --ma1: #FFB547; --ma2: #B98CFF; --ma3: #4FD1BC; color-scheme: dark }
  :root:not([data-theme="light"])[data-updown="us"] { --up: #6FD39A; --down: #FF8A80 } }
:root[data-theme="dark"] {
  --bg: #0F151B; --surface: #172029; --surface-2: #1E2933; --fg: #E6ECF1; --muted: #93A2AF; --line: #2A3743;
  --ink: #9DB8E8; --good: #6FD39A; --good-bg: #173524; --warn-bg: #3A3013; --warn: #F1CE6B; --alert-bg: #3A1A18; --alert: #FFB4AB;
  --c-bg: #26313B; --c-fg: #B5C0CA; --star: #F5C542; --up: #FF6B6B; --down: #6FA8FF;
  --ma1: #FFB547; --ma2: #B98CFF; --ma3: #4FD1BC; color-scheme: dark }
:root[data-theme="dark"][data-updown="us"] { --up: #6FD39A; --down: #FF8A80 }

* { box-sizing: border-box }
.wrap > * { min-width: 0 }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; margin: 0 }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }
a { color: inherit }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.na { color: var(--muted); font-weight: 400 }
.pos { color: var(--up) } .neg { color: var(--down) }

header.top { display: grid; gap: 8px }
h1 { font-weight: 700; font-size: clamp(22px, 3.2vw, 30px); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
.meta b { color: var(--fg); font-weight: 600 }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px }
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.pill.ok .d { background: var(--good) }
.notice { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 8px; padding: 8px 12px }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
.stat .k { font-size: 12px; color: var(--muted) }
.stat .v { font-family: var(--font-num); font-size: 19px; font-weight: 600; line-height: 1.3 }
.stat .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100% }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex: none }
.seg button { border: 0; background: none; padding: 7px 11px; font-size: 13px; white-space: nowrap }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.seg.sm button { padding: 3px 9px; font-size: 12px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 11px; font-size: 13px; white-space: nowrap }
.btn[aria-expanded="true"], .btn.on { border-color: var(--ink); color: var(--ink); font-weight: 600 }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px 5px 8px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.chip .dot { width: 10px; height: 10px; border-radius: 3px }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); font-weight: 600 }
.count { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 13px }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.filters[hidden] { display: none }
.fl { display: grid; gap: 4px; font-size: 12.5px }
.fl .top { display: flex; justify-content: space-between; color: var(--muted) }
.fl .top b { color: var(--fg); font-family: var(--font-num); font-weight: 600 }
.fl input[type=range] { width: 100%; accent-color: var(--ink) }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; cursor: pointer }
.head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center }
.tk { font-family: var(--font-num); font-weight: 600; font-size: 13px; color: #fff; padding: 5px 8px; border-radius: 6px; text-decoration: none; letter-spacing: 0.02em; white-space: nowrap }
.nm { min-width: 0 }
.nm .n { font-weight: 700; font-size: 15px; line-height: 1.25 }
.nm .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.grade { font-family: var(--font-num); font-weight: 700; font-size: 13px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none }
.g-A { background: var(--good-bg); color: var(--good) } .g-B { background: var(--warn-bg); color: var(--warn) } .g-C { background: var(--c-bg); color: var(--c-fg) }
.star { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0 }
.star svg { width: 20px; height: 20px }
.star[aria-pressed="true"] { color: var(--star) }
.star:hover { background: var(--surface-2) }
.px { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end }
.big { font-family: var(--font-num); font-size: 24px; font-weight: 600; line-height: 1.1 }
.chgline { font-family: var(--font-num); font-size: 13px; font-weight: 600 }
.asof { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.badge.warn { background: var(--warn-bg); color: var(--warn) }
.badge.alert { background: var(--alert-bg); color: var(--alert) }
.sp { display: grid; justify-items: end; gap: 2px; font-size: 11px }
.spark { width: 120px; height: 38px; display: block }
.desc { font-size: 13px; margin: 0; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.m { background: var(--surface-2); padding: 7px 8px; display: grid; gap: 1px; min-width: 0 }
.m .k { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.m .v { font-family: var(--font-num); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.range { display: grid; gap: 4px }
.range .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted) }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line) }
.pin { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--fg) }
.tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px }
.tag { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted) }
.mine { font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 7px 10px; display: grid; gap: 2px; border-left: 3px solid var(--star) }
.mine .memo { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hit { color: var(--good); font-weight: 700 }
.more { justify-self: start; border: 0; background: none; color: var(--ink); font-weight: 600; font-size: 13px; padding: 0 }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; min-width: 1060px; font-size: 13px }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle }
th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap }
th[aria-sort] { color: var(--fg) }
td.r, th.r { text-align: right }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--surface-2) }
td .tk { font-size: 12px; padding: 3px 6px }
td .star { width: 28px; height: 28px }

.guide { display: grid; gap: 10px }
h2 { font-size: 18px; margin: 8px 0 0 }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px }
.gc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; font-size: 12.5px; min-width: 0 }
.gc .k { color: var(--muted) }
.note { color: var(--muted); font-size: 12px; line-height: 1.6 }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r) }

/* 상세 패널 */
dialog#dlg { padding: 0; border: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; height: 100dvh; max-height: 100dvh; width: min(820px, 100vw); max-width: 100vw; background: var(--bg); color: var(--fg); box-shadow: -8px 0 30px rgba(0,0,0,.25) }
dialog#dlg::backdrop { background: rgba(10, 15, 20, .45) }
.dl { display: grid; gap: 14px; padding: 0 16px calc(32px + env(safe-area-inset-bottom)) }
.dhead { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center }
.dhead .ctl { display: flex; gap: 4px; align-items: center }
.icon { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; padding: 0 }
.icon svg { width: 18px; height: 18px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0 }
.panel h3 { margin: 0; font-size: 14px }
.dprice { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline }
.dprice .big { font-size: 32px }
.dprice .chgline { font-size: 16px }
.links { display: flex; flex-wrap: wrap; gap: 6px }
.links a { font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface); white-space: nowrap }
.links a:hover { border-color: var(--ink); color: var(--ink) }
.links a.pri { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.ctop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center }
.legend { font-family: var(--font-num); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; min-height: 18px }
.legend .k { color: var(--muted) }
.malgd { display: flex; gap: 10px; font-size: 12px; flex-wrap: wrap }
.malgd label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.malgd i { width: 14px; height: 3px; border-radius: 2px; display: inline-block }
#chart { height: 340px; position: relative; min-width: 0 }
#chart svg { display: block }
.cnote { font-size: 12px; color: var(--muted) }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.kv > div { background: var(--surface-2); padding: 8px 10px; display: grid; gap: 1px; min-width: 0 }
.kv .k { font-size: 11px; color: var(--muted) }
.kv .v { font-family: var(--font-num); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.txt { display: grid; gap: 8px; font-size: 13px; margin: 0 }
.txt dt { color: var(--muted); font-size: 12px } .txt dd { margin: 0 }
.alertbox { background: var(--alert-bg); color: var(--alert); border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 500 }
.form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
.form input, .form textarea { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; font-size: 14px; color: var(--fg); min-width: 0; width: 100% }
.form input { font-family: var(--font-num) }
.form .full { grid-column: 1 / -1 }
.form textarea { min-height: 90px; resize: vertical; line-height: 1.5 }
.calc { font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px }
.saved { font-size: 12px; color: var(--muted) }
@media (max-width: 640px) {
  .kv { grid-template-columns: repeat(2, 1fr) } .form { grid-template-columns: 1fr 1fr } #chart { height: 280px }
  .dprice .big { font-size: 26px } }
@media (max-width: 480px) { .mets { grid-template-columns: repeat(2, 1fr) } .spark { width: 96px } }

.ctrls { display: grid; gap: 8px; min-width: 0 }
.mob, .tabbar, .scrim { display: none }
.btn.prim { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600 }
/* 목록 보기(증권 앱 스타일 한 줄 목록) */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.rw { display: grid; grid-template-columns: 58px minmax(0, 1fr) 56px auto; gap: 10px; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--line); cursor: pointer }
.rw:last-child { border-bottom: 0 }
.rw:hover, .rw:focus-visible { background: var(--surface-2) }
.rw .tk { text-align: center; font-size: 12px; padding: 5px 4px }
.rw .n { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rw .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden }
.gs { width: 18px; height: 18px; font-size: 11px; display: inline-grid }
.rw .spark { width: 56px; height: 28px }
.rp { text-align: right; display: grid; justify-items: end; gap: 1px }
.rp .p { font-family: var(--font-num); font-weight: 600; font-size: 15px }
.rp .chgline { font-size: 12.5px }
.mystar { color: var(--star) }
@media (max-width: 640px) {
  body { padding-bottom: calc(62px + env(safe-area-inset-bottom)) }
  .wrap { gap: 14px; padding-block: 14px 24px }
  h1 { font-size: 21px }
  .meta { font-size: 12px; gap: 4px 10px }
  .notice { font-size: 12px; padding: 7px 10px }
  .stats { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(150px, 62%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; scrollbar-width: none }
  .stat { scroll-snap-align: start; padding: 10px 12px }
  .stat .v { font-size: 17px }
  .bar { padding-block: 8px }
  .btn.mob { display: inline-flex }
  .shead.mob { display: flex; justify-content: space-between; align-items: center; font-size: 16px }
  .row.mob { display: grid; grid-template-columns: 1fr 2fr }
  .ctrls { display: none }
  .ctrls.open { display: grid; gap: 12px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 86dvh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
  .ctrls .row { gap: 10px }
  .ctrls select { flex: 1 1 100%; padding: 10px }
  .ctrls .seg button { padding: 9px 13px }
  .ctrls .filters[hidden] { display: grid } #fbtn { display: none }
  .ctrls .filters { border: 0; padding: 0; background: none; grid-template-columns: 1fr }
  .sfoot .btn { padding: 11px; justify-content: center }
  body.sheet-open .bar { z-index: 50 }
  .scrim:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(10, 15, 20, .45) }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom) }
  .tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; font-size: 11px; color: var(--muted) }
  .tabbar svg { width: 22px; height: 22px }
  .tabbar button[aria-pressed="true"] { color: var(--ink); font-weight: 700 }
  .dhead .ctl { gap: 2px } .dhead .icon { width: 32px; height: 32px }
  .dhead .nm .n { font-size: 15.5px !important }
}
@media (max-width: 380px) { .rw { grid-template-columns: 52px minmax(0, 1fr) auto } .rw .rsp { display: none } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s } .card:hover { border-color: var(--muted) } }
</style>

<div class="wrap">
  <header class="top">
    <h1>저평가 우량주 워치리스트</h1>
    <div class="meta" id="meta"></div>
    <div class="notice" id="pricenote"></div>
  </header>
  <section class="stats" id="stats" aria-label="요약"></section>

  <div class="bar" role="search">
    <div class="row">
      <input id="q" class="search" type="search" placeholder="티커, 회사명, 사업 내용, 내 메모로 검색" aria-label="검색">
      <button type="button" class="btn mob" id="obtn" aria-expanded="false" aria-controls="ctrls">필터·정렬</button>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <div class="ctrls" id="ctrls" role="group" aria-label="필터와 정렬">
